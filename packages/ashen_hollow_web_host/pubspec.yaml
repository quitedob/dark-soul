name: ashen_hollow_web_host
description: OpenHarmony ArkUI Web platform-view host for Ashen Hollow.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ohos:
        package: dev.ashenhollow.web_host
        pluginClass: AshenHollowWebHostPlugin
